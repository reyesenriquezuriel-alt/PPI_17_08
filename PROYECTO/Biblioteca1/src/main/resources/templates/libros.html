<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gestión de Libros</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">

<link rel="stylesheet" href="/css/estilo.css">

</head>

<body>

<div class="sidebar">

    <div class="logo">

        <img
        src="/img/logo.png"
        alt="UAEMéx">

        <h3>Biblioteca</h3>

        <p>UAEMéx</p>

    </div>

    <div class="menu">

        <div class="menu-title">
            General
        </div>

        <a href="/">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </a>

        <div class="menu-title">
            Catálogo
        </div>

        <a href="/libros">
            <i class="bi bi-book"></i>
            Libros
        </a>

        <div class="menu-title">
            Usuarios
        </div>

        <a href="/usuarios">
            <i class="bi bi-people"></i>
            Usuarios
        </a>

        <div class="menu-title">
            Operaciones
        </div>

        <a href="/prestamos">
            <i class="bi bi-arrow-left-right"></i>
            Préstamos
        </a>

        <a href="/reservas">
            <i class="bi bi-journal-bookmark"></i>
            Reservas
        </a>

        <div class="menu-title">
            Administración
        </div>

        <a href="/reportes">
            <i class="bi bi-file-earmark-bar-graph"></i>
            Reportes
        </a>

    </div>

</div>

<div class="content">

    <div class="topbar">

        <div class="page-title">
            Gestión de Libros
        </div>

        <div class="page-subtitle">
            Administración del catálogo bibliográfico institucional.
        </div>

    </div>

    <div class="main">

        <div class="card card-main">

            <div class="card-body p-4">

                <div class="section-title">

                    Registrar Nuevo Libro

                </div>

                <form id="formLibro">

                    <div class="row g-3">

                        <div class="col-md-4">

                            <label class="form-label">
                                Título
                            </label>

                            <input
                            class="form-control"
                            id="titulo"
                            required>

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">
                                Autor
                            </label>

                            <input
                            class="form-control"
                            id="autor"
                            required>

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">
                                ISBN
                            </label>

                            <input
                            class="form-control"
                            id="isbn">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">
                                Categoría
                            </label>

                            <input
                            class="form-control"
                            id="categoria">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">
                                Stock
                            </label>

                            <input
                            type="number"
                            class="form-control"
                            id="stock">

                        </div>

                        <div class="col-md-4 d-flex align-items-end">

                            <button
                            type="submit"
                            class="btn btn-uaem w-100">

                                Guardar Libro

                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </div>

        <div class="card card-main mt-4">

            <div class="card-body p-4">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <h4>

                        Catálogo de Libros

                    </h4>

                    <input
                    type="text"
                    class="form-control"
                    style="max-width:300px"
                    placeholder="Buscar libro...">

                </div>

                <div class="table-responsive">

                    <table class="table table-hover">

                        <thead>

                        <tr>

                            <th>ID</th>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Categoría</th>
                            <th>Disponibles</th>
                            <th>Estado</th>

                        </tr>

                        </thead>

                        <tbody id="tablaLibros">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

cargarLibros();

function cargarLibros(){

fetch("/api/libros")

.then(response => response.json())

.then(data => {

const tabla =
document.getElementById(
"tablaLibros"
);

tabla.innerHTML = "";

data.forEach(libro => {

let estado =

libro.disponibles > 0

?

'<span class="badge-disponible">Disponible</span>'

:

'<span class="badge-agotado">Agotado</span>';

tabla.innerHTML += `

<tr>

<td>${libro.id}</td>

<td>${libro.titulo}</td>

<td>${libro.autor}</td>

<td>${libro.categoria}</td>

<td>${libro.disponibles}</td>

<td>${estado}</td>

</tr>

`;

});

});

}

document
.getElementById("formLibro")
.addEventListener("submit",

function(e){

e.preventDefault();

const libro = {

titulo:
document.getElementById("titulo").value,

autor:
document.getElementById("autor").value,

isbn:
document.getElementById("isbn").value,

categoria:
document.getElementById("categoria").value,

stock:
parseInt(
document.getElementById("stock").value
),

disponibles:
parseInt(
document.getElementById("stock").value
)

};

fetch("/api/libros",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(libro)

})

.then(()=>{

document
.getElementById("formLibro")
.reset();

cargarLibros();

});

});

</script>

</body>

</html>
