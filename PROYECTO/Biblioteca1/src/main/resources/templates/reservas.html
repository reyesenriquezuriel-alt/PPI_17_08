<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gestión de Reservas</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">

<link rel="stylesheet" href="/css/estilo.css">

</head>

<body>

<div class="sidebar">

    <div class="logo">

        <img
        src="/img/logo.png"
        alt="UAEMéx">

        <h3>Biblioteca</h3>

        <p>UAEMéx</p>

    </div>

    <div class="menu">

        <div class="menu-title">
            General
        </div>

        <a href="/">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </a>

        <div class="menu-title">
            Catálogo
        </div>

        <a href="/libros">
            <i class="bi bi-book"></i>
            Libros
        </a>

        <div class="menu-title">
            Usuarios
        </div>

        <a href="/usuarios">
            <i class="bi bi-people"></i>
            Usuarios
        </a>

        <div class="menu-title">
            Operaciones
        </div>

        <a href="/prestamos">
            <i class="bi bi-arrow-left-right"></i>
            Préstamos
        </a>

        <a href="/reservas">
            <i class="bi bi-journal-bookmark"></i>
            Reservas
        </a>

        <div class="menu-title">
            Administración
        </div>

        <a href="/reportes">
            <i class="bi bi-file-earmark-bar-graph"></i>
            Reportes
        </a>

    </div>

</div>

<div class="content">

    <div class="topbar">

        <div class="page-title">
            Gestión de Reservas
        </div>

        <div class="page-subtitle">
            Registro y seguimiento de reservas bibliográficas.
        </div>

    </div>

    <div class="main">

        <div class="card card-main">

            <div class="card-body p-4">

                <div class="section-title">

                    Registrar Reserva

                </div>

                <form id="formReserva">

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label class="form-label">
                                Usuario
                            </label>

                            <select
                            id="usuario"
                            class="form-select">

                                <option value="">
                                    Seleccione un usuario
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                Libro
                            </label>

                            <select
                            id="libro"
                            class="form-select">

                                <option value="">
                                    Seleccione un libro
                                </option>

                            </select>

                        </div>

                    </div>

                    <div class="row mt-3">

                        <div class="col-md-3">

                            <button
                            type="submit"
                            class="btn btn-uaem w-100">

                                Registrar Reserva

                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </div>

        <div class="card card-main mt-4">

            <div class="card-body p-4">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <h4>

                        Historial de Reservas

                    </h4>

                </div>

                <div class="table-responsive">

                    <table class="table table-hover">

                        <thead>

                        <tr>

                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Libro</th>
                            <th>Fecha</th>
                            <th>Estado</th>

                        </tr>

                        </thead>

                        <tbody id="tablaReservas">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

cargarUsuarios();
cargarLibros();
cargarReservas();

function cargarUsuarios(){

fetch("/api/usuarios")

.then(response => response.json())

.then(data => {

const combo =
document.getElementById("usuario");

combo.innerHTML =
'<option value="">Seleccione un usuario</option>';

data.forEach(usuario => {

combo.innerHTML += `

<option value="${usuario.id}">
${usuario.nombre}
</option>

`;

});

});

}

function cargarLibros(){

fetch("/api/libros")

.then(response => response.json())

.then(data => {

const combo =
document.getElementById("libro");

combo.innerHTML =
'<option value="">Seleccione un libro</option>';

data.forEach(libro => {

combo.innerHTML += `

<option value="${libro.id}">
${libro.titulo}
</option>

`;

});

});

}

function cargarReservas(){

fetch("/api/reservas")

.then(response => response.json())

.then(data => {

const tabla =
document.getElementById("tablaReservas");

tabla.innerHTML = "";

data.forEach(reserva => {

tabla.innerHTML += `

<tr>

<td>${reserva.id}</td>

<td>${reserva.usuario.nombre}</td>

<td>${reserva.libro.titulo}</td>

<td>${reserva.fechaReserva ?? ''}</td>

<td>

<span class="badge-reserva">

Reservada

</span>

</td>

</tr>

`;

});

});

}

document
.getElementById("formReserva")
.addEventListener("submit",

function(e){

e.preventDefault();

const reserva = {

usuario:{

id:Number(
document.getElementById("usuario").value
)

},

libro:{

id:Number(
document.getElementById("libro").value
)

}

};

fetch("/api/reservas",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(reserva)

})
.then(() => {

document
.getElementById("formReserva")
.reset();

cargarReservas();

});

});

</script>

</body>

</html>
