<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gestión de Usuarios</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">

<link rel="stylesheet" href="/css/estilo.css">

</head>

<body>

<div class="sidebar">

    <div class="logo">

        <img
        src="/img/logo.png"
        alt="UAEMéx">

        <h3>Biblioteca</h3>

        <p>UAEMéx</p>

    </div>

    <div class="menu">

        <div class="menu-title">
            General
        </div>

        <a href="/">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </a>

        <div class="menu-title">
            Catálogo
        </div>

        <a href="/libros">
            <i class="bi bi-book"></i>
            Libros
        </a>

        <div class="menu-title">
            Usuarios
        </div>

        <a href="/usuarios">
            <i class="bi bi-people"></i>
            Usuarios
        </a>

        <div class="menu-title">
            Operaciones
        </div>

        <a href="/prestamos">
            <i class="bi bi-arrow-left-right"></i>
            Préstamos
        </a>

        <a href="/reservas">
            <i class="bi bi-journal-bookmark"></i>
            Reservas
        </a>

        <div class="menu-title">
            Administración
        </div>

        <a href="/reportes">
            <i class="bi bi-file-earmark-bar-graph"></i>
            Reportes
        </a>

    </div>

</div>

<div class="content">

    <div class="topbar">

        <div class="page-title">
            Gestión de Usuarios
        </div>

        <div class="page-subtitle">
            Administración de usuarios y roles del sistema.
        </div>

    </div>

    <div class="main">

        <div class="card card-main">

            <div class="card-body p-4">

                <div class="section-title">

                    Registrar Usuario

                </div>

                <form id="formUsuario">

                    <div class="row g-3">

                        <div class="col-md-3">

                            <label class="form-label">
                                Nombre
                            </label>

                            <input
                            id="nombre"
                            class="form-control"
                            required>

                        </div>

                        <div class="col-md-3">

                            <label class="form-label">
                                Correo
                            </label>

                            <input
                            type="email"
                            id="correo"
                            class="form-control"
                            required>

                        </div>

                        <div class="col-md-2">

                            <label class="form-label">
                                Contraseña
                            </label>

                            <input
                            type="password"
                            id="password"
                            class="form-control"
                            required>

                        </div>

                        <div class="col-md-2">

                            <label class="form-label">
                                Estado
                            </label>

                            <select
                            id="activo"
                            class="form-select">

                                <option value="true">
                                    Activo
                                </option>

                                <option value="false">
                                    Inactivo
                                </option>

                            </select>

                        </div>

                        <div class="col-md-2">

                            <label class="form-label">
                                Rol
                            </label>

                            <select
                            id="rol"
                            class="form-select">

                                <option value="">
                                    Seleccione
                                </option>

                            </select>

                        </div>

                    </div>

                    <div class="row mt-3">

                        <div class="col-md-3">

                            <button
                            type="submit"
                            class="btn btn-uaem w-100">

                                Guardar Usuario

                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </div>

        <div class="card card-main mt-4">

            <div class="card-body p-4">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <h4>

                        Usuarios Registrados

                    </h4>

                    <input
                    type="text"
                    class="form-control"
                    style="max-width:300px;"
                    placeholder="Buscar usuario...">

                </div>

                <div class="table-responsive">

                    <table class="table table-hover">

                        <thead>

                        <tr>

                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Estado</th>
                            <th>Rol</th>
                            <th>Acciones</th>

                        </tr>

                        </thead>

                        <tbody id="tablaUsuarios">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

cargarUsuarios();
cargarRoles();

function cargarUsuarios(){

fetch("/api/usuarios")

.then(response => response.json())

.then(data => {

let tabla =
document.getElementById(
"tablaUsuarios"
);

tabla.innerHTML = "";

data.forEach(usuario => {

let estado =

usuario.activo

?

'<span class="badge-activo">Activo</span>'

:

'<span class="badge-inactivo">Inactivo</span>';

tabla.innerHTML += `

<tr>

<td>${usuario.id}</td>

<td>${usuario.nombre}</td>

<td>${usuario.correo}</td>

<td>${estado}</td>

<td>

${usuario.rol
? usuario.rol.nombre
: 'Sin rol'}

</td>

<td>

<button
class="btn btn-danger btn-sm"
onclick="eliminarUsuario(${usuario.id})">

Eliminar

</button>

</td>

</tr>

`;

});

});

}

function cargarRoles(){

fetch("/api/roles")

.then(response => response.json())

.then(data => {

const combo =
document.getElementById("rol");

combo.innerHTML =
'<option value="">Seleccione</option>';

data.forEach(rol => {

combo.innerHTML += `

<option value="${rol.id}">
${rol.nombre}
</option>

`;

});

});

}

document
.getElementById("formUsuario")
.addEventListener("submit",

function(e){

e.preventDefault();

const rolId =
document.getElementById("rol").value;

const usuario = {

nombre:
document.getElementById("nombre").value,

correo:
document.getElementById("correo").value,

password:
document.getElementById("password").value,

activo:
document.getElementById("activo").value
=== "true",

rol: rolId
?
{
id:Number(rolId)
}
: null

};

fetch("/api/usuarios",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(usuario)

})
.then(() => {

document
.getElementById("formUsuario")
.reset();

cargarUsuarios();

});

});

function eliminarUsuario(id){

if(
confirm(
"¿Desea eliminar este usuario?"
)
){

fetch(
"/api/usuarios/" + id,
{
method:"DELETE"
}
)
.then(() => {

cargarUsuarios();

});

}

}

</script>

</body>

</html>
